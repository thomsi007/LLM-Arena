<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Aréna</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23151a24'/><circle cx='11' cy='16' r='6' fill='%234f8cff'/><circle cx='21' cy='16' r='6' fill='%23ff8a3d' fill-opacity='.85'/></svg>">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo"><i class="dot a"></i><i class="dot b"></i></span>
      <div>
        <div class="brand-title">LLM Aréna</div>
        <div class="brand-sub" id="project-name">–</div>
      </div>
    </div>
    <div class="pills">
      <button class="pill slot-a" id="pill-A" data-tab="settings" title="LLM A állapota"><i></i><span>LLM A</span></button>
      <button class="pill slot-b" id="pill-B" data-tab="settings" title="LLM B állapota"><i></i><span>LLM B</span></button>
    </div>
    <div class="jobs" id="jobs"></div>
    <button class="icon-btn" id="theme-toggle" title="Téma váltása">◐</button>
  </header>
  <div class="layout">
    <nav class="sidebar" id="nav">
      <div class="nav-group">Konfiguráció</div>
      <a href="#settings" data-tab="settings">⚙ <span>LLM beállítások</span></a>
      <div class="nav-group">Munkafolyamatok</div>
      <a href="#arena" data-tab="arena">⚔ <span>Aréna</span></a>
      <a href="#debate" data-tab="debate">🗣 <span>Vita</span></a>
      <a href="#design" data-tab="design">🧩 <span>Programtervezés</span></a>
      <a href="#code" data-tab="code">‹› <span>Kódnézet</span></a>
      <a href="#testing" data-tab="testing">✔ <span>Tesztelés</span></a>
      <a href="#consensus" data-tab="consensus">⚖ <span>Közös döntés</span></a>
      <a href="#pipeline" data-tab="pipeline">⇶ <span>Teljes folyamat</span></a>
      <div class="nav-group">Egyéb</div>
      <a href="#log" data-tab="log">☰ <span>Napló</span></a>
      <a href="#project" data-tab="project">💾 <span>Projekt</span></a>
    </nav>
    <main id="main"></main>
  </div>
  <div id="toasts"></div>
  <div id="boot-error" class="errbox" style="display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:100"></div>
  <script>
    // Visible diagnostics when the JS application cannot start.
    (function () {
      var box = document.getElementById("boot-error");
      function show(msg) {
        box.style.display = "block";
        box.innerHTML = "<strong>A felület nem tudott elindulni.</strong> " + msg +
          "<br><small>Tipp: a programot a <code>python -m llm_arena</code> paranccsal indítsd, és a kiírt " +
          "http://127.0.0.1:8765 címet nyisd meg (ne az index.html fájlt közvetlenül). Frissíts Ctrl+F5-tel.</small>";
      }
      if (location.protocol === "file:") show("Az oldal fájlként (file://) nyílt meg.");
      window.addEventListener("error", function (e) {
        if (!window.__arenaBooted) show((e.message || "Szkript betöltési hiba") + (e.filename ? " (" + e.filename + ")" : ""));
      }, true);
      setTimeout(function () {
        if (!window.__arenaBooted) show("A JavaScript modulok nem töltődtek be (lásd a böngésző konzolját: F12).");
      }, 4000);
    })();
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
